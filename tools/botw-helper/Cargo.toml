[package]
name = "botw-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tga"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
dirs = "6"
tempfile = "3"

[[bin]]
name = "BotWHelper"
path = "src/main.rs"
